name: Agent eval

# ข้อสอบของแงว รันอัตโนมัติทุกครั้งที่โค้ดของ agent เปลี่ยน
# ต้องตั้ง repository secret ชื่อ CRON_SECRET ให้ตรงกับที่ตั้งไว้ใน Supabase
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "tests/**"
      - ".github/workflows/agent-eval.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to run the eval against"
        type: choice
        options: [sonnet, haiku]
        default: sonnet
      cases:
        description: "Which case file to run"
        type: choice
        options: ["tests/cases.json", "tests/cases-judge.json"]
        default: "tests/cases.json"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run agent eval
        shell: pwsh
        env:
          TEST_KEY: ${{ secrets.CRON_SECRET }}
          # push runs leave this empty, so the script's own default (sonnet) applies
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_CASES: ${{ inputs.cases }}
        run: |
          if (-not $env:TEST_KEY) {
            Write-Host "::error::CRON_SECRET repository secret is not set - add it in Settings > Secrets and variables > Actions"
            exit 1
          }
          # ห้ามใช้ชื่อ $args มันเป็นตัวแปรสงวนของ PowerShell
          $evalArgs = @{ TestKey = $env:TEST_KEY }
          if ($env:EVAL_MODEL) { $evalArgs.Model = $env:EVAL_MODEL }
          if ($env:EVAL_CASES) { $evalArgs.CasesPath = (Resolve-Path $env:EVAL_CASES).Path }
          ./tests/run-eval.ps1 @evalArgs
