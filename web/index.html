<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MT Agent — Admin Console</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161920; --panel2:#1c2029; --line:#252a34; --text:#e6e8eb; --dim:#9aa4b2;
    --accent:#5b9cf8; --ok:#3fb98c; --warn:#e0a33e; --bad:#e06c6c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;font-size:15px}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .who{color:var(--dim);font-size:13px;margin-left:auto}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);padding:7px 13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#08101f;font-weight:600}
  button.danger:hover{border-color:var(--bad);color:var(--bad)}
  button.small{padding:4px 9px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  nav{display:flex;gap:6px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:thin}
  nav button{border-radius:7px 7px 0 0;border-bottom:none;white-space:nowrap}
  nav button.on{background:var(--panel);border-color:var(--line);color:var(--accent)}
  main{padding:14px 20px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px;font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .tile .n{font-size:26px;font-weight:600;line-height:1.2}
  .tile .l{color:var(--dim);font-size:12px;margin-top:4px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
    color:var(--dim);white-space:nowrap;display:inline-block}
  .tag.TASK,.tag.accent{color:var(--accent);border-color:var(--accent)}
  .tag.DECISION,.tag.ok{color:var(--ok);border-color:var(--ok)}
  .tag.DEADLINE,.tag.warn{color:var(--warn);border-color:var(--warn)}
  .tag.bad{color:var(--bad);border-color:var(--bad)}
  .muted{color:var(--dim);font-size:13px}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .excerpt{color:var(--dim);font-size:13px;border-left:2px solid var(--line);padding-left:10px;
    margin-top:8px;white-space:pre-wrap;line-height:1.6}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  th{color:var(--dim);font-weight:500;font-size:12px;white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  select,input[type=text],input[type=date],input[type=datetime-local],textarea{font:inherit;background:var(--bg);
    color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  textarea{width:100%;min-height:58px;resize:vertical;line-height:1.5}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
  .off{opacity:.45}
  .banner{border-radius:10px;padding:12px 14px;margin-bottom:12px;border:1px solid}
  .banner.bad{border-color:var(--bad);background:rgba(224,108,108,.08)}
  .banner.warn{border-color:var(--warn);background:rgba(224,163,62,.08)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .bar > i{display:block;height:100%;background:var(--ok)}
  .chatgrid{display:grid;grid-template-columns:260px 1fr;gap:12px}
  @media (max-width:760px){.chatgrid{grid-template-columns:1fr}}
  .chatlist button{display:block;width:100%;text-align:left;margin-bottom:6px}
  .chatlist button.on{border-color:var(--accent)}
  .msg{padding:9px 11px;border-radius:9px;margin-bottom:8px;background:var(--panel2);border:1px solid var(--line)}
  .msg.bot{border-left:3px solid var(--accent)}
  .msg.flagged{border-color:var(--bad)}
  .msg .t{white-space:pre-wrap;line-height:1.55;margin-top:4px;word-break:break-word}
  .chk{text-align:center}
  .chk label{display:inline-flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:10px 16px;display:none;max-width:90vw;z-index:9}
  #toast.bad{border-color:var(--bad);color:var(--bad)}
  .empty{color:var(--dim);text-align:center;padding:34px 10px;line-height:1.8}
  #gate{display:grid;place-items:center;min-height:70vh;text-align:center;padding:24px}
  #gate code{background:var(--panel);padding:2px 7px;border-radius:5px}
  #app[hidden]{display:none}
</style>
</head>
<body>

<div id="gate">
  <div style="max-width:440px">
    <h1 style="font-size:20px;margin:0 0 14px">🔒 ต้องเข้าผ่านลิงก์จากแชท</h1>
    <p class="muted" style="line-height:1.9;margin:0">
      พิมพ์ในแชทกับแงวว่า <code>ขอลิงก์ console</code><br>
      บอทจะส่งลิงก์ให้ทางแชทส่วนตัว ใช้ได้ครั้งเดียวภายใน 15 นาที<br>
      เข้าได้เฉพาะ ADMIN เท่านั้น
    </p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>🐾 MT Agent — Admin Console</h1>
    <span class="who" id="who"></span>
    <button id="logout">ออกจากระบบ</button>
  </header>
  <nav id="tabs">
    <button data-tab="events" class="on">คิวยืนยัน <span id="badge"></span></button>
    <button data-tab="reminders">ตัวเตือน</button>
    <button data-tab="checklist">เช็กลิสต์สาขา</button>
    <button data-tab="chats">แชท</button>
    <button data-tab="groups">กลุ่ม</button>
    <button data-tab="users">พนักงาน</button>
    <button data-tab="usage">การใช้งาน</button>
    <button data-tab="health">สุขภาพระบบ <span id="healthDot"></span></button>
    <button data-tab="dash">ภาพรวม</button>
  </nav>
  <main>
    <section id="tab-events"></section>
    <section id="tab-reminders" hidden></section>
    <section id="tab-checklist" hidden></section>
    <section id="tab-chats" hidden></section>
    <section id="tab-groups" hidden></section>
    <section id="tab-users" hidden></section>
    <section id="tab-usage" hidden></section>
    <section id="tab-health" hidden></section>
    <section id="tab-dash" hidden></section>
  </main>
</div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
