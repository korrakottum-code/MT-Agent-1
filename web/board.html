<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>บอร์ดงานทีม</title>
<style>
  :root{
    --bg:#f5f6f8;--panel:#fff;--line:#e4e7ec;--text:#1d2433;--dim:#667085;--accent:#3b5bdb;
    --doing:#1971c2;--doing-bg:#e7f1fb;--review:#7048e8;--review-bg:#f0ebfe;--blocked:#c92a2a;--blocked-bg:#fdecec;
    --todo:#495057;--todo-bg:#f0f1f3;--done:#2b8a3e;--warn:#b35c00;--warn-bg:#fff3e0;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#10131a;--panel:#191d27;--line:#2a303d;--text:#e8ebf1;--dim:#98a2b3;--accent:#8aa4ff;
    --doing:#74b4f2;--doing-bg:#16293e;--review:#b39dfa;--review-bg:#272045;--blocked:#ff8f8f;--blocked-bg:#3c1d1f;
    --todo:#c1c7d0;--todo-bg:#272c37;--done:#6fcf85;--warn:#ffb866;--warn-bg:#3a2a14;color-scheme:dark;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;font-size:15px;line-height:1.5}
  header{padding:20px 16px 8px;max-width:1400px;margin:auto}
  h1{font-size:22px;margin:0}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;max-width:1400px;margin:auto;align-items:center}
  .bar[hidden]{display:none}
  input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
  input[type=search]{flex:1 1 180px;min-width:0}
  label.check{display:flex;gap:6px;align-items:center;font-size:14px}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:6px 16px 32px;max-width:1400px;margin:auto}
  @media (max-width:380px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
  .card h2{font-size:17px;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .card h2 small{font-weight:400;color:var(--dim);font-size:12px}
  .meta{color:var(--dim);font-size:12.5px;margin-top:2px}
  .meta.stale{color:var(--warn)}
  h3{font-size:12.5px;margin:12px 0 4px;color:var(--dim);font-weight:600}
  ul{list-style:none;margin:0;padding:0}
  li{padding:3px 0;font-size:14px;overflow-wrap:anywhere}
  .task{padding:7px 0;border-top:1px solid var(--line)}
  .task:first-child{border-top:0}
  .pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;margin-right:6px;font-weight:600;white-space:nowrap}
  .TODO{color:var(--todo);background:var(--todo-bg)}.DOING{color:var(--doing);background:var(--doing-bg)}
  .REVIEW{color:var(--review);background:var(--review-bg)}.BLOCKED{color:var(--blocked);background:var(--blocked-bg)}
  .late{color:var(--blocked);background:var(--blocked-bg)}
  .tmeta{color:var(--dim);font-size:12.5px}
  .tick{color:var(--done);margin-right:5px}.box{color:var(--dim);margin-right:5px}
  details summary{cursor:pointer;color:var(--dim);font-size:12.5px;margin-top:10px}
  .empty{color:var(--dim);font-size:13.5px;margin:10px 0 0}
  #msg{max-width:640px;margin:48px auto;padding:0 16px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>บอร์ดงานทีม</h1>
  <div class="sub" id="sub">กำลังโหลด…</div>
</header>
<div class="bar" id="bar" hidden>
  <input type="search" id="q" placeholder="ค้นชื่อคนหรือชื่องาน" aria-label="ค้นชื่อคนหรือชื่องาน">
  <select id="group" aria-label="กลุ่ม"><option value="">ทุกกลุ่ม</option></select>
  <select id="days" aria-label="ช่วงเวลา">
    <option value="1">วันนี้</option><option value="7" selected>7 วัน</option><option value="14">14 วัน</option><option value="30">30 วัน</option>
  </select>
  <label class="check"><input type="checkbox" id="onlyOpen"> เฉพาะคนที่มีงานค้าง</label>
</div>
<main id="list"></main>
<div id="msg" hidden></div>
<script src="board.js"></script>
</body>
</html>
